# ml-model-tool: an AIOS app (app contract 2.10) and a Python library.
# uv run で起動できる独立プロジェクト（規約 §4）。
[project]
name = "ml-model-tool"
version = "0.1.0"
description = "Make physics surrogate / generative models (PhysicsNeMo FNO) from JSON specs: data, train, evaluate, predict"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # 頭脳との接続（agk.connect）: コマンドの宣言から入力欄の文法・CLI・MCP の run・窓を作る
    "agk[connect]>=0.54.0",
    "mcp>=2.0",
    "flask>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10",
    "torch>=2.4",
    # macOS (Apple Silicon, macOS 14+) と Linux。macOS は CPU（CUDA なし）
    "nvidia-physicsnemo>=2.2",
]

[project.optional-dependencies]
# TopoDiff のテスト（level_<k>.npz）を TopoDiff の評価コードで評価するとき
topodiff = ["solidspy==1.1.0.post1", "opencv-python-headless>=4.8"]

[project.scripts]
mmt = "ml_model_tool_cli.cli:main"
ml-model-tool-mcp = "ml_model_tool.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_model_tool", "src/ml_model_tool_cli"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
